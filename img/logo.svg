<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" role="img" aria-labelledby="title desc">
  <title id="title">Rushikesh Sapkal logo</title>
  <desc id="desc">Personal portfolio logo with RS monogram</desc>
  <defs>
    <linearGradient id="markGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="220" height="48" fill="none"/>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#markGradient)"/>
  <text x="24" y="31" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="1">RS</text>
  <text x="58" y="23" fill="#1c1e53" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="0">Rushikesh Sapkal</text>
  <text x="59" y="38" fill="#52627a" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">SOFTWARE ENGINEER</text>
</svg>
